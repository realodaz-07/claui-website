name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not set on realodaz-07/claui-website. Deploy ABORTED - the live site was NOT updated. Fix with: gh secret set CLOUDFLARE_API_TOKEN -R realodaz-07/claui-website"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is present - proceeding with deploy."

      - uses: actions/checkout@v4
      - name: Assemble dist (assets allowlist)
        run: |
          mkdir -p dist/css dist/js dist/assets
          cp index.html dist/
          cp css/styles.css dist/css/
          cp js/main.js dist/js/
          cp assets/* dist/assets/
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1a27e68352eb5c992f9f46417dc6dc7a
          command: pages deploy dist --project-name=claui-website --branch=main
